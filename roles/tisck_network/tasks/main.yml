---
# tasks for roles/tisck_network

- name: Check if Docker network exists
  ansible.builtin.command:
    cmd: "docker network inspect {{ tisck_docker_network }}"
  register: tisck_net_check
  failed_when: false
  changed_when: false

- name: Create shared backbone Docker network (tisck-net)
  ansible.builtin.command:
    cmd: >
      docker network create
      --driver bridge
      --subnet {{ tisck_docker_network_subnet }}
      --gateway {{ tisck_docker_network_gateway }}
      {{ tisck_docker_network }}
  when: tisck_net_check.rc != 0
  changed_when: true
